name: Build

on:
  push:
    branches: [main]
  pull_request:

# Releases are built, signed with Developer ID and notarized on the maintainer's Mac
# (scripts/build-app.sh). CI only proves that the project compiles.
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile check (Xcode project, unsigned)
        run: ./scripts/build-app.sh ci
      - name: Compile check (Swift Package)
        run: swift build -c release
